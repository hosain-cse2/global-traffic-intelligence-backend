services:
  postgres:
    image: postgres:16
    container_name: global-traffic-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: global_traffic_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: global-traffic-backend:latest
    container_name: global-traffic-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/global_traffic_intelligence?schema=public
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
